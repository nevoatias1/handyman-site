spring:
  application:
    name: handyman-backend
  profiles:
    default: dev
  h2:
    console:
      enabled: false
  mvc:
    log-request-details: false
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 101MB
      file-size-threshold: 0

logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.zaxxer.hikari: WARN
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.cloudinary: INFO
    org.apache.hc: INFO

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  port: 8080
  tomcat:
    max-part-count: 11
    max-swallow-size: 101MB
  # In prod behind a trusted proxy, set server.forward-headers-strategy=native.
  # Configure proxy trust at the container; application code uses getRemoteAddr() only.
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict
        secure: false

---
spring:
  config:
    activate:
      on-profile: "dev & !prod"
    import: optional:file:./config/application-dev-local.yml
  datasource:
    url: jdbc:h2:mem:handyman;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:10000}
  address: 0.0.0.0
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 30
      min-spare: 2
  servlet:
    session:
      cookie:
        secure: true
